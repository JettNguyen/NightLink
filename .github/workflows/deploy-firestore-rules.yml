name: Deploy Firestore Rules

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

concurrency:
  group: firestore-rules-deploy
  cancel-in-progress: true

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID || 'nightlink-3d3e8' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate auth configuration
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Using FIREBASE_SERVICE_ACCOUNT credentials_json auth."
            SA_PROJECT_ID=$(node -e "const raw=process.env.FIREBASE_SERVICE_ACCOUNT||''; const p=JSON.parse(raw); process.stdout.write(p.project_id||'');")
            SA_CLIENT_EMAIL=$(node -e "const raw=process.env.FIREBASE_SERVICE_ACCOUNT||''; const p=JSON.parse(raw); process.stdout.write(p.client_email||'');")
            echo "Service account email: $SA_CLIENT_EMAIL"
            echo "Service account project_id: $SA_PROJECT_ID"
            if [ -n "$SA_PROJECT_ID" ] && [ "$SA_PROJECT_ID" != "$FIREBASE_PROJECT_ID" ]; then
              echo "FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) does not match service account project_id ($SA_PROJECT_ID)."
              echo "Update FIREBASE_PROJECT_ID or use a service account from the target project."
              exit 1
            fi
            exit 0
          fi

          if [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$GCP_SERVICE_ACCOUNT_EMAIL" ]; then
            echo "Using Workload Identity Federation auth."
            exit 0
          fi

          echo "Missing auth secrets. Set FIREBASE_SERVICE_ACCOUNT, or set both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT_EMAIL."
          exit 1

      - name: Authenticate to Google Cloud (Service Account JSON)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Workload Identity)
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT_EMAIL != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Show active deploy identity
        run: |
          gcloud --version
          echo "Target project: $FIREBASE_PROJECT_ID"
          echo "Active account: $(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          gcloud services list --enabled --project "$FIREBASE_PROJECT_ID" --filter="name:firestore.googleapis.com" --format="value(name)" || true

      - name: Deploy Firestore rules and indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
